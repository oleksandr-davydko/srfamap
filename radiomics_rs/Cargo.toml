[package]
name = "radiomics_rs"
version = "1.0.0"
edition = "2021"
rust-version = "1.78.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "radiomics_rs"
crate-type = ["cdylib"]

[dependencies]
ndarray = { version = "0.15.6", features = ["serde"] }
numpy = "0.21.0"
pyo3 = "0.21.2"
itertools = "0.12.1"
log = "0.4.21"
pyo3-log = "0.10.0"
serde = "1.0.203"
ndarray-npy = "0.8.1"

